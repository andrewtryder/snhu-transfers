version: 2.1

parameters:
  run_transfer_sync:
    type: boolean
    default: false

jobs:
  sync-transfer-data:
    docker:
      - image: cimg/node:24.13
    resource_class: small

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Apply database migrations
          command: npm run db:migrate

      - run:
          name: Synchronize transfer data
          command: |
            set -uo pipefail
            mkdir -p /tmp/sync-results

            set +e
            npm run transfer:sync 2>&1 | tee /tmp/sync-results/sync-output.log
            SYNC_EXIT=${PIPESTATUS[0]}
            set -e

            printf '%s\n' "$SYNC_EXIT" > /tmp/sync-results/sync-exit-code
            tail -n 1 /tmp/sync-results/sync-output.log \
              > /tmp/sync-results/sync-output.json

            set +e
            node scripts/validate-transfer-sync-result.mjs /tmp/sync-results/sync-output.json
            VALIDATION_EXIT=$?
            set -e

            printf '%s\n' "$VALIDATION_EXIT" > /tmp/sync-results/validation-exit-code
            exit 0

      - run:
          name: Revalidate production cache on promotion
          command: |
            set -euo pipefail
            SYNC_EXIT=$(cat /tmp/sync-results/sync-exit-code)
            VALIDATION_EXIT=$(cat /tmp/sync-results/validation-exit-code)

            if [ "$SYNC_EXIT" -ne 0 ] || [ "$VALIDATION_EXIT" -ne 0 ]; then
              echo "Skipping revalidation: synchronization result is not valid for promotion."
              printf '0\n' > /tmp/sync-results/revalidation-exit-code
              exit 0
            fi

            SYNC_ACTION=$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("/tmp/sync-results/sync-output.json", "utf8")).action);')
            echo "Sync Action Result: ${SYNC_ACTION}"

            if [ "${SYNC_ACTION}" = "promoted" ]; then
              set +e
              curl --fail --silent --show-error --request POST \
                --header "Authorization: Bearer ${REVALIDATE_SECRET}" \
                "${SITE_URL}/api/revalidate" \
                | tee /tmp/sync-results/revalidation-response.json
              REVALIDATION_EXIT=${PIPESTATUS[0]}
              set -e
            else
              echo "Skipping revalidation: Sync action was '${SYNC_ACTION}'."
              REVALIDATION_EXIT=0
            fi

            printf '%s\n' "$REVALIDATION_EXIT" > /tmp/sync-results/revalidation-exit-code

      - store_artifacts:
          path: /tmp/sync-results
          destination: sync-results

      - run:
          name: Report synchronization result
          command: |
            set -euo pipefail
            SYNC_EXIT=$(cat /tmp/sync-results/sync-exit-code)
            VALIDATION_EXIT=$(cat /tmp/sync-results/validation-exit-code)

            if [ "$SYNC_EXIT" -ne 0 ]; then
              echo "Transfer synchronization failed; artifacts were preserved."
              exit "$SYNC_EXIT"
            fi

            if [ "$VALIDATION_EXIT" -ne 0 ]; then
              echo "Transfer synchronization result was invalid; artifacts were preserved."
              exit "$VALIDATION_EXIT"
            fi

            SYNC_ACTION=$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("/tmp/sync-results/sync-output.json", "utf8")).action);')
            if [ "$SYNC_ACTION" = "error" ]; then
              echo "Transfer synchronization reported an error; artifacts were preserved."
              exit 1
            fi

            if [ "$SYNC_ACTION" = "promoted" ] && [ "$(cat /tmp/sync-results/revalidation-exit-code)" -ne 0 ]; then
              echo "Transfer promotion succeeded but cache revalidation failed; artifacts were preserved."
              exit 1
            fi

workflows:
  scheduled-transfer-sync:
    when:
      and:
        - << pipeline.parameters.run_transfer_sync >>
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - sync-transfer-data:
          context:
            - snhu-transfers-sync
